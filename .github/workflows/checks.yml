name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: devtools/pyright/package-lock.json
      - name: Install locked development tools
        run: |
          python -m pip install uv==0.12.5
          uv venv --python 3.14.7 .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-dev.lock
          npm ci --prefix devtools/pyright --ignore-scripts --no-audit --no-fund
      - name: Type check all maintained Python
        run: devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv/bin/python --outputjson
      - name: Lint
        run: .venv/bin/ruff check --no-cache custom_components tests
      - name: Lightweight offline tests
        run: .venv/bin/python -B -m unittest discover -s tests -v
      - name: Check runtime Python 3.11 syntax
        run: |
          .venv/bin/python -B - <<'PYTHON'
          import ast
          from pathlib import Path
          for path in Path('custom_components/kocom_wallpad').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path), feature_version=(3, 11))
          PYTHON

  home-assistant-2026-9:
    name: Home Assistant 2026.9.2 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked compatibility dependencies
        run: |
          python -m pip install uv==0.12.5
          uv venv --python 3.14.7 .venv-ha2026.9
          uv pip sync --python .venv-ha2026.9/bin/python --require-hashes requirements-ha2026.9.lock
          npm ci --prefix devtools/pyright --ignore-scripts --no-audit --no-fund
      - name: Check installed core version
        run: .venv-ha2026.9/bin/python -c 'from importlib.metadata import version; assert version("homeassistant") == "2026.9.2"'
      - name: Check compatibility types
        run: |
          devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv-ha2026.9/bin/python
          devtools/pyright/node_modules/.bin/pyright --project pyrightconfig.json --pythonpath .venv-ha2026.9/bin/python tests_ha/conftest.py tests_ha/test_setup_entities.py tests_ha/test_serial_dependency.py
      - name: Run offline and real Home Assistant tests in separate processes
        run: |
          .venv-ha2026.9/bin/python -B -m unittest discover -s tests -v
          .venv-ha2026.9/bin/python -B -m pytest -p no:cacheprovider --disable-socket --allow-unix-socket -o asyncio_mode=auto tests_ha
      - name: Lint compatibility sources
        run: .venv-ha2026.9/bin/ruff check --no-cache custom_components tests tests_ha
